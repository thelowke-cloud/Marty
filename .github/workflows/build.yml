name: Build IPA

on:
  push:
    branches:
      - main
      - "claude/**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Archive unsigned IPA
    runs-on: macos-latest
    env:
      SCHEME: NoteReader
      ARCHIVE_PATH: build/NoteReader.xcarchive
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          # Prefer the newest stable Xcode 16.x on the runner; fall back to the runner default.
          CANDIDATE="$(ls -d /Applications/Xcode_16*.app 2>/dev/null | grep -v -i beta | sort -V | tail -n 1 || true)"
          if [ -n "$CANDIDATE" ]; then
            sudo xcode-select -s "$CANDIDATE"
          fi
          xcodebuild -version
          xcode-select -p

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild archive \
            -project NoteReader.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            | tee build/xcodebuild.log | grep -E "^(error|warning|\*\*|Archive|Build|=== )|error:|warning:|Compiling|Ld " || true
          # Fail the step if xcodebuild itself failed (the grep above swallows the exit code)
          if ! grep -q "ARCHIVE SUCCEEDED" build/xcodebuild.log; then
            echo "::error::xcodebuild archive failed; see build/xcodebuild.log"
            tail -n 200 build/xcodebuild.log
            exit 1
          fi

      - name: Package IPA
        run: |
          set -euo pipefail
          APP="$ARCHIVE_PATH/Products/Applications/NoteReader.app"
          test -d "$APP"
          rm -rf build/Payload build/NoteReader.ipa
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          (cd build && zip -qry NoteReader.ipa Payload)
          ls -la build/NoteReader.ipa
          unzip -l build/NoteReader.ipa | head -n 20

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          if-no-files-found: ignore

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoteReader-ipa
          path: build/NoteReader.ipa
          if-no-files-found: error

      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/NoteReader.ipa
          generate_release_notes: true
