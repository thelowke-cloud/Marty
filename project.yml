# XcodeGen project spec. CI runs `xcodegen generate` to produce NoteReader.xcodeproj.
# Signing: builds are unsigned (sideloading re-signs at install time).
# To move to a paid developer account / TestFlight, set DEVELOPMENT_TEAM below and
# add a signed export step in .github/workflows/build.yml (see README).
name: NoteReader

options:
  bundleIdPrefix: com.lowke
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

targets:
  NoteReader:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: NoteReader
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lowke.notereader
        PRODUCT_NAME: NoteReader
        INFOPLIST_FILE: NoteReader/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_STRICT_CONCURRENCY: minimal
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
schemes:
  NoteReader:
    build:
      targets:
        NoteReader: all
    run:
      config: Debug
    archive:
      config: Release
